            background-clip: text;

           Acquisition
        ------------------------------ */

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #697482;

            margin-bottom: 12px;
        }

            display: inline-block;

            font-size: 18px;

            font-weight: 450;

            letter-spacing: 0.2px;

            color: #dce3eb;
